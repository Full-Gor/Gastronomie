<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notre Menu - Délices & Saveurs</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            box-sizing: border-box;
            font-family: 'Helvetica Neue', Arial, sans-serif;
        }

        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            overflow: hidden;
            background: #000;
            color: #fff;
        }

        /* Navigation */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
            padding: 30px 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s ease;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(10px);
        }

        .logo {
            font-size: 24px;
            font-weight: 300;
            letter-spacing: 3px;
            z-index: 1001;
        }

        .nav-links {
            display: flex;
            gap: 40px;
            list-style: none;
        }

        .nav-links a {
            color: #fff;
            text-decoration: none;
            font-size: 14px;
            letter-spacing: 2px;
            text-transform: uppercase;
            position: relative;
            transition: opacity 0.3s;
        }

        .nav-links a:hover {
            opacity: 0.7;
        }

        .nav-links a.active {
            opacity: 1;
        }

        .nav-links a.active::after {
            width: 100%;
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 0;
            height: 1px;
            background: #fff;
            transition: width 0.3s;
        }

        .nav-links a:hover::after {
            width: 100%;
        }

        /* Menu Burger */
        .burger-menu {
            display: none;
            flex-direction: column;
            cursor: pointer;
            z-index: 1001;
            width: 30px;
            height: 24px;
            position: relative;
        }

        .burger-menu span {
            width: 100%;
            height: 2px;
            background: #fff;
            transition: all 0.3s ease;
            position: absolute;
            left: 0;
        }

        .burger-menu span:nth-child(1) {
            top: 0;
        }

        .burger-menu span:nth-child(2) {
            top: 50%;
            transform: translateY(-50%);
        }

        .burger-menu span:nth-child(3) {
            bottom: 0;
        }

        .burger-menu.active span:nth-child(1) {
            top: 50%;
            transform: translateY(-50%) rotate(45deg);
        }

        .burger-menu.active span:nth-child(2) {
            opacity: 0;
        }

        .burger-menu.active span:nth-child(3) {
            bottom: 50%;
            transform: translateY(50%) rotate(-45deg);
        }

        /* Slider Container */
        .cont {
            position: relative;
            height: 100vh;
            overflow: hidden;
            margin-top: 0;
        }

        .slider {
            position: relative;
            height: 100%;
            transform: translate3d(0, 0, 0);
            will-change: transform;
            cursor: all-scroll;
            user-select: none;
        }

        .slider.animation {
            transition: transform 750ms ease-in-out;
        }

        .slider.animation .slide__darkbg {
            transition: transform 750ms ease-in-out;
        }

        .slider.animation .slide__text {
            transition: transform 750ms ease-in-out;
        }

        .slider.animation .slide__letter {
            transition: transform 750ms ease-in-out;
        }

        .slide {
            position: absolute;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .slide--1 { left: 0%; }
        .slide--2 { left: 100%; }
        .slide--3 { left: 200%; }
        .slide--4 { left: 300%; }

        .slide__darkbg {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            transform: translate3d(0, 0, 0);
            will-change: transform;
            z-index: 10;
        }

        .slide__text-wrapper {
            position: absolute;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            z-index: 15;
        }

        .slide__letter {
            position: absolute;
            display: flex;
            align-items: center;
            justify-content: center;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform: translate3d(0, 0, 0);
            -webkit-text-fill-color: transparent !important;
            -webkit-background-clip: text !important;
            background-clip: text !important;
            font-size: 50vw;
            font-weight: 800;
            color: #000;
            z-index: 2;
            will-change: transform;
            user-select: none;
        }

        .slide__text {
            font-size: 8vw;
            font-weight: 800;
            text-transform: uppercase;
            transform: translate3d(0, 0, 0);
            letter-spacing: 12px;
            color: #fff;
            will-change: transform;
            user-select: none;
        }

        .slide__text:nth-child(odd) {
            z-index: 2;
        }

        .slide__text:nth-child(even) {
            z-index: 1;
        }

        /* Slide backgrounds */
        .slide--1__darkbg {
            left: 0%;
            background: url('https://images.unsplash.com/photo-1512621776951-a57141f2eefd?q=80&w=1920') center center no-repeat;
            background-size: cover;
            background-position: 0px center;
            transform: translate3d(0, 0, 0);
            will-change: transform;
        }

        .slide--1__darkbg:after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(11, 15, 39, 0.83);
        }

        .slide--1__letter {
            background: url('https://images.unsplash.com/photo-1512621776951-a57141f2eefd?q=80&w=1920') center center no-repeat;
            background-position: 0px center;
            background-size: cover;
        }

        .slide--2__darkbg {
            left: -50%;
            background: url('https://images.unsplash.com/photo-1585937421612-70a008356fbe?q=80&w=1920') center center no-repeat;
            background-size: cover;
            background-position: 0px center;
            transform: translate3d(0, 0, 0);
            will-change: transform;
        }

        .slide--2__darkbg:after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(11, 15, 39, 0.7);
        }

        .slide--2__letter {
            background: url('https://images.unsplash.com/photo-1585937421612-70a008356fbe?q=80&w=1920') center center no-repeat;
            background-position: 0px center;
            background-size: cover;
        }

        .slide--3__darkbg {
            left: -100%;
            background: url('https://images.unsplash.com/photo-1579954115545-a95591f28bfc?q=80&w=1920') center center no-repeat;
            background-size: cover;
            background-position: 0px center;
            transform: translate3d(0, 0, 0);
            will-change: transform;
        }

        .slide--3__darkbg:after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(11, 15, 39, 0.83);
        }

        .slide--3__letter {
            background: url('https://images.unsplash.com/photo-1579954115545-a95591f28bfc?q=80&w=1920') center center no-repeat;
            background-position: 0px center;
            background-size: cover;
        }

        .slide--4__darkbg {
            left: -150%;
            background: url('https://images.unsplash.com/photo-1576092768241-dec231879fc3?q=80&w=1920') center center no-repeat;
            background-size: cover;
            background-position: 0px center;
            transform: translate3d(0, 0, 0);
            will-change: transform;
        }

        .slide--4__darkbg:after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(11, 15, 39, 0.83);
        }

        .slide--4__letter {
            background: url('https://images.unsplash.com/photo-1576092768241-dec231879fc3?q=80&w=1920') center center no-repeat;
            background-position: 0px center;
            background-size: cover;
        }


        /* Navigation dots */
        .nav {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            list-style-type: none;
            z-index: 100;
        }

        .nav__slide {
            position: relative;
            display: inline-block;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 2px solid #fff;
            margin-left: 10px;
            cursor: pointer;
        }

        .nav__slide:hover:after {
            transform: translate(-50%, -50%) scale(1, 1);
            opacity: 1;
        }

        .nav__slide:after {
            content: "";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0, 0);
            width: 75%;
            height: 75%;
            border-radius: 50%;
            background-color: #fff;
            opacity: 0;
            transition: 300ms;
        }

        .nav__slide--1 {
            margin-left: 0;
        }

        .nav-active:after {
            transform: translate(-50%, -50%) scale(1, 1);
            opacity: 1;
        }

        /* Side navigation arrows */
        .side-nav {
            position: absolute;
            width: 10%;
            height: 100%;
            top: 0;
            z-index: 90;
            cursor: pointer;
            opacity: 0;
            transition: 300ms;
        }

        .side-nav:hover {
            opacity: 0.1;
        }

        .side-nav--right {
            right: 0;
            background-image: linear-gradient(to right, rgba(255, 255, 255, 0) 0%, #eed7ff 100%);
        }

        .side-nav--left {
            left: 0;
            background-image: linear-gradient(to left, rgba(255, 255, 255, 0) 0%, #eed7ff 100%);
        }

        /* Responsive */
        @media (max-width: 1024px) {
            nav {
                padding: 20px 40px;
            }

            .burger-menu {
                display: flex;
            }

            .nav-links {
                position: fixed;
                top: 0;
                right: -100%;
                height: 100vh;
                width: 70%;
                max-width: 400px;
                background: rgba(0, 0, 0, 0.98);
                backdrop-filter: blur(20px);
                flex-direction: column;
                justify-content: center;
                align-items: center;
                gap: 40px;
                transition: right 0.4s ease;
                padding: 60px 40px;
            }

            .nav-links.active {
                right: 0;
            }

            .nav-links a {
                font-size: 18px;
                letter-spacing: 3px;
            }

            .slide__text {
                font-size: 10vw;
                letter-spacing: 8px;
            }

            .slide__letter {
                font-size: 55vw;
            }
        }

        @media (max-width: 768px) {
            nav {
                padding: 15px 20px;
            }

            .logo {
                font-size: 20px;
                letter-spacing: 2px;
            }

            .nav-links {
                width: 80%;
                max-width: none;
                gap: 30px;
                padding: 40px 30px;
            }

            .nav-links a {
                font-size: 16px;
                letter-spacing: 2px;
            }

            .slide__text {
                font-size: 12vw;
                letter-spacing: 6px;
            }

            .slide__letter {
                font-size: 60vw;
            }

            .nav__slide {
                width: 24px;
                height: 24px;
            }

            .side-nav {
                width: 15%;
            }

            .slider {
                cursor: grab;
            }

            .slider:active {
                cursor: grabbing;
            }
        }

        @media (max-width: 480px) {
            .logo {
                font-size: 18px;
                letter-spacing: 2px;
            }

            .burger-menu {
                width: 26px;
                height: 20px;
            }

            .nav-links {
                width: 85%;
                gap: 25px;
                padding: 30px 20px;
            }

            .nav-links a {
                font-size: 15px;
                letter-spacing: 2px;
            }

            .slide__text {
                font-size: 14vw;
                letter-spacing: 4px;
            }

            .slide__letter {
                font-size: 65vw;
            }

            .nav__slide {
                width: 22px;
                height: 22px;
                margin-left: 8px;
            }

            .side-nav {
                width: 20%;
            }

            .nav {
                bottom: 20px;
            }
        }

        @media (max-width: 400px) {
            .slide__text {
                font-size: 16vw;
                letter-spacing: 2px;
            }

            .slide__letter {
                font-size: 70vw;
            }

            .nav__slide {
                width: 20px;
                height: 20px;
            }
        }

        @media (hover: none) and (pointer: coarse) {
            .side-nav {
                display: none;
            }

            .slider {
                cursor: grab;
            }

            .slider:active {
                cursor: grabbing;
            }
        }
    </style>
</head>
<body>
    <nav id="navbar">
        <div class="logo">DÉLICES & SAVEURS</div>
        <div class="burger-menu" id="burger">
            <span></span>
            <span></span>
            <span></span>
        </div>
        <ul class="nav-links" id="navLinks">
            <li><a href="index.html">Accueil</a></li>
            <li><a href="menu.html" class="active">Notre Menu</a></li>
            <li><a href="apropos.html">À Propos</a></li>
            <li><a href="services.html">Services</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>

    <div class="cont">
        <div class="slider"></div>
        <ul class="nav"></ul>
        <div data-target='right' class="side-nav side-nav--right"></div>
        <div data-target='left' class="side-nav side-nav--left"></div>
    </div>

    <script>
        // Burger Menu Toggle
        const burger = document.getElementById('burger');
        const navLinks = document.getElementById('navLinks');
        const navbar = document.getElementById('navbar');

        burger.addEventListener('click', () => {
            burger.classList.toggle('active');
            navLinks.classList.toggle('active');
            document.body.style.overflow = navLinks.classList.contains('active') ? 'hidden' : 'auto';
        });

        document.querySelectorAll('.nav-links a').forEach(link => {
            link.addEventListener('click', () => {
                burger.classList.remove('active');
                navLinks.classList.remove('active');
                document.body.style.overflow = 'auto';
            });
        });

        document.addEventListener('click', (e) => {
            if (!navbar.contains(e.target) && navLinks.classList.contains('active')) {
                burger.classList.remove('active');
                navLinks.classList.remove('active');
                document.body.style.overflow = 'auto';
            }
        });

        // Slider parallax functionality
        $(document).ready(function () {
            const $cont = $(".cont");
            const $slider = $(".slider");
            const $nav = $(".nav");
            const winW = $(window).width();
            const animSpd = 750;
            const distOfLetGo = winW * 0.2;
            let curSlide = 1;
            let animation = false;
            let autoScrollVar = true;
            let diff = 0;

            // Generating slides
            let arrCategories = ["Salade", "Plats", "Desserts", "Boissons"];
            let numOfCategories = arrCategories.length;
            let arrCategoriesDivided = [];

            arrCategories.map((category) => {
                let length = category.length;
                let letters = Math.floor(length / 4);
                let exp = new RegExp(".{1," + letters + "}", "g");
                arrCategoriesDivided.push(category.match(exp));
            });

            let generateSlide = function (category) {
                let frag1 = $(document.createDocumentFragment());
                let frag2 = $(document.createDocumentFragment());
                const numSlide = arrCategories.indexOf(arrCategories[category]) + 1;
                const firstLetter = arrCategoriesDivided[category][0].charAt(0);

                const $slide = $(`<div data-target="${numSlide}" class="slide slide--${numSlide}">
                                    <div class="slide__darkbg slide--${numSlide}__darkbg"></div>
                                    <div class="slide__text-wrapper slide--${numSlide}__text-wrapper"></div>
                                </div>`);

                const letter = $(`<div class="slide__letter slide--${numSlide}__letter">
                                    ${firstLetter}
                                </div>`);

                for (let i = 0, length = arrCategoriesDivided[category].length; i < length; i++) {
                    const text = $(`<div class="slide__text slide__text--${i + 1}">
                                        ${arrCategoriesDivided[category][i]}
                                    </div>`);
                    frag1.append(text);
                }

                const navSlide = $(
                    `<li data-target="${numSlide}" class="nav__slide nav__slide--${numSlide}"></li>`
                );
                frag2.append(navSlide);
                $nav.append(frag2);

                $slide.find(`.slide--${numSlide}__text-wrapper`).append(letter).append(frag1);
                $slider.append($slide);

                if (arrCategories[category].length <= 4) {
                    $(".slide--" + numSlide)
                        .find(".slide__text")
                        .css("font-size", "12vw");
                }
            };

            for (let i = 0, length = numOfCategories; i < length; i++) {
                generateSlide(i);
            }

            $(".nav__slide--1").addClass("nav-active");

            // Navigation
            function bullets(dir) {
                $(".nav__slide--" + curSlide).removeClass("nav-active");
                $(".nav__slide--" + dir).addClass("nav-active");
            }

            function timeout() {
                animation = false;
            }

            function pagination(direction) {
                animation = true;
                diff = 0;
                $slider.addClass("animation");
                $slider.css({
                    transform: "translate3d(-" + (curSlide - direction) * 100 + "%, 0, 0)"
                });

                $slider.find(".slide__darkbg").css({
                    transform: "translate3d(" + (curSlide - direction) * 50 + "%, 0, 0)"
                });

                $slider.find(".slide__letter").css({
                    transform: "translate3d(0, 0, 0)"
                });

                $slider.find(".slide__text").css({
                    transform: "translate3d(0, 0, 0)"
                });
            }

            function navigateRight() {
                if (!autoScrollVar) return;
                if (curSlide >= numOfCategories) return;
                pagination(0);
                setTimeout(timeout, animSpd);
                bullets(curSlide + 1);
                curSlide++;
            }

            function navigateLeft() {
                if (curSlide <= 1) return;
                pagination(2);
                setTimeout(timeout, animSpd);
                bullets(curSlide - 1);
                curSlide--;
            }

            function toDefault() {
                pagination(1);
                setTimeout(timeout, animSpd);
            }

            // Events
            $(document).on("mousedown touchstart", ".slide", function (e) {
                if (animation) return;
                let target = +$(this).attr("data-target");
                let startX = e.pageX || e.originalEvent.touches[0].pageX;
                $slider.removeClass("animation");

                $(document).on("mousemove touchmove", function (e) {
                    let x = e.pageX || e.originalEvent.touches[0].pageX;
                    diff = startX - x;
                    if ((target === 1 && diff < 0) || (target === numOfCategories && diff > 0))
                        return;

                    $slider.css({
                        transform: "translate3d(-" + ((curSlide - 1) * 100 + diff / 30) + "%, 0, 0)"
                    });

                    $slider.find(".slide__darkbg").css({
                        transform: "translate3d(" + ((curSlide - 1) * 50 + diff / 60) + "%, 0, 0)"
                    });

                    $slider.find(".slide__letter").css({
                        transform: "translate3d(" + diff / 60 + "vw, 0, 0)"
                    });

                    $slider.find(".slide__text").css({
                        transform: "translate3d(" + diff / 15 + "px, 0, 0)"
                    });
                });
            });

            $(document).on("mouseup touchend", function (e) {
                $(document).off("mousemove touchmove");

                if (animation) return;

                if (diff >= distOfLetGo) {
                    navigateRight();
                } else if (diff <= -distOfLetGo) {
                    navigateLeft();
                } else {
                    toDefault();
                }
            });

            $(document).on("click", ".nav__slide:not(.nav-active)", function () {
                let target = +$(this).attr("data-target");
                bullets(target);
                curSlide = target;
                pagination(1);
            });

            $(document).on("click", ".side-nav", function () {
                let target = $(this).attr("data-target");

                if (target === "right") navigateRight();
                if (target === "left") navigateLeft();
            });

            $(document).on("keydown", function (e) {
                if (e.which === 39) navigateRight();
                if (e.which === 37) navigateLeft();
            });

            $(document).on("mousewheel DOMMouseScroll", function (e) {
                if (animation) return;
                let delta = e.originalEvent.wheelDelta;

                if (delta > 0 || e.originalEvent.detail < 0) navigateLeft();
                if (delta < 0 || e.originalEvent.detail > 0) navigateRight();
            });
        });
    </script>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <!-- Configuration -->
    <script src="firebase-config.js"></script>
    <script src="app.js"></script>
</body>
</html>
